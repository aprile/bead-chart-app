<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bead Chart</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <h1>Bead Chart</h1>
        <nav class="view-switch" aria-label="Views">
          <a href="#chart">Chart</a>
          <a href="#stash">My stash</a>
        </nav>
      </header>

      <section id="chart-view">
      <form id="new-chart-form" class="panel">
        <h2>New chart</h2>

        <fieldset>
          <legend>Stitch</legend>
          <label><input type="radio" name="stitch" value="loom" checked /> Loom</label>
          <label><input type="radio" name="stitch" value="brick" /> Brick stitch</label>
        </fieldset>

        <fieldset>
          <legend>Bead size</legend>
          <label><input type="radio" name="beadSize" value="11/0" checked /> 11/0</label>
          <label><input type="radio" name="beadSize" value="15/0" /> 15/0</label>
        </fieldset>

        <fieldset>
          <legend>Finished size</legend>
          <div class="size-row">
            <label>
              Width
              <input type="number" name="width" value="2" min="0" step="any" inputmode="decimal" />
            </label>
            <span aria-hidden="true">×</span>
            <label>
              Height
              <input type="number" name="height" value="18" min="0" step="any" inputmode="decimal" />
            </label>
            <label>
              Unit
              <select name="unit">
                <option value="mm">mm</option>
                <option value="cm" selected>cm</option>
              </select>
            </label>
          </div>
        </fieldset>

        <output id="size-result" class="result" for="new-chart-form"></output>
      </form>

      <div class="toolbar">
        <!-- Stash colours; filled in by src/palette.js -->
        <div id="palette" class="palette" aria-label="Colours"></div>
        <div class="actions">
          <button type="button" id="undo-button" title="Undo (⌘Z)">Undo</button>
          <button type="button" id="redo-button" title="Redo (⇧⌘Z)">Redo</button>
          <button type="button" id="clear-button">Clear chart</button>
        </div>
      </div>

      <!-- Scrolls sideways if a chart is ever wider than the screen. -->
      <div class="grid-wrap">
        <canvas id="chart-canvas"></canvas>
      </div>
      </section>

      <section id="stash-view" hidden>
        <h2>My stash</h2>
        <p class="note">Screen colours are rough guesses from the colour names.</p>
        <div class="stash-top">
          <p id="stash-counts" class="stash-counts"></p>
          <button type="button" id="add-color-button" class="primary">Add colour</button>
        </div>

        <div class="stash-filters">
          <label>
            Search
            <input type="search" id="stash-search" placeholder="Code or name" />
          </label>
          <label>
            Size
            <select id="stash-size">
              <option value="">All</option>
              <option value="11/0">11/0</option>
              <option value="15/0">15/0</option>
            </select>
          </label>
          <label>
            Colour family
            <select id="stash-family"><option value="">All</option></select>
          </label>
          <label>
            Finish
            <select id="stash-finish"><option value="">All</option></select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="stash-only" /> Show only my stash
          </label>
        </div>

        <p id="stash-showing" class="note"></p>
        <!-- Filled in by src/stash-screen.js -->
        <ul id="stash-list" class="stash-list"></ul>
      </section>

      <!-- Pop-up forms for colours (src/color-dialogs.js) -->

      <dialog id="custom-color-dialog">
        <form class="dialog-form">
          <h3 class="dialog-title">Add colour</h3>
          <label>
            Name
            <input type="text" name="name" required maxlength="80" placeholder="e.g. Grandma's teal" />
          </label>
          <label>
            Screen colour
            <input type="color" name="hex" value="#888888" />
          </label>
          <fieldset>
            <legend>Sizes</legend>
            <label><input type="checkbox" name="sizes" value="11/0" /> 11/0</label>
            <label><input type="checkbox" name="sizes" value="15/0" /> 15/0</label>
          </fieldset>
          <label>
            Code (optional)
            <input type="text" name="code" maxlength="20" />
          </label>
          <label>
            Notes (optional)
            <textarea name="notes" rows="2" maxlength="500" placeholder="e.g. brand, where I bought it"></textarea>
          </label>
          <p class="form-error" hidden></p>
          <div class="dialog-buttons">
            <button type="button" class="danger" data-action="delete">Delete</button>
            <button type="button" data-action="cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </dialog>

      <dialog id="screen-color-dialog">
        <form class="dialog-form">
          <h3>Edit screen colour</h3>
          <p class="dialog-color-name"></p>
          <label>
            Screen colour
            <input type="color" name="hex" />
          </label>
          <p class="note">
            Estimated colour: <span class="swatch-inline estimated-swatch"></span>
            <span class="estimated-hex"></span>
          </p>
          <div class="dialog-buttons">
            <button type="button" data-action="reset">Reset to estimated colour</button>
            <button type="button" data-action="cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </dialog>

      <dialog id="delete-color-dialog">
        <form class="dialog-form">
          <h3>Delete colour?</h3>
          <p class="delete-message"></p>
          <label>
            Replace those beads with
            <span class="replacement-row">
              <span class="swatch-inline replacement-swatch"></span>
              <select name="replacement"></select>
            </span>
          </label>
          <div class="dialog-buttons">
            <button type="button" data-action="cancel">Cancel</button>
            <button type="submit" class="danger">Delete and replace</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
